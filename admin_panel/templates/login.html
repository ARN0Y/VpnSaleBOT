<!doctype html>
<html lang="fa" dir="rtl" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | NavidVPN</title>
  <script src="/static/tailwind.js"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: { sans: ["Vazirmatn", "ui-sans-serif", "system-ui"] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="min-h-screen bg-[#05070c] font-sans text-slate-100 antialiased">
  <main class="grid min-h-screen place-items-center px-4 py-10">
    <section class="card w-full max-w-md p-6">
      <div class="mb-6 text-center">
        <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-2xl border border-cyan-300/50 bg-cyan-300/10 text-cyan-100">
          <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M8.5 10l7 4M15.5 10l-7 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <p class="text-[0.68rem] font-black uppercase text-cyan-200/90">NavidVPN Console</p>
        <h1 class="mt-2 text-2xl font-black text-white">ورود امن مدیریت</h1>
        <p class="mt-2 text-sm leading-7 text-slate-400">برای دسترسی به داشبورد، اطلاعات ورود تعریف‌شده در فایل محیطی را وارد کنید.</p>
      </div>

      {% if error %}
        <div class="mb-5 rounded-2xl border border-rose-400/20 bg-rose-400/10 p-3 text-sm font-bold text-rose-100">{{ error }}</div>
      {% endif %}

      <form method="post" action="/admin/login" class="space-y-4">
        <label class="block">
          <span class="field-label">نام کاربری</span>
          <input name="username" value="{{ username }}" autocomplete="username" required class="input-base mt-2" autofocus>
        </label>
        <label class="block">
          <span class="field-label">رمز عبور</span>
          <input name="password" type="password" autocomplete="current-password" required class="input-base mt-2">
        </label>
        <button class="btn-primary w-full">ورود به پنل</button>
      </form>
    </section>
  </main>
</body>
</html>
